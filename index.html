
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTWorld Multiview</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Segoe UI,Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

.container{
    display:flex;
    height:100vh;
}

.main{
    flex:1;
    padding:10px;
    overflow:auto;
}

.sidebar{
    width:400px;
    background:#1b1b1b;
    border-left:1px solid #333;
    display:flex;
    flex-direction:column;
}

.header{
    padding:15px;
    border-bottom:1px solid #333;
}

textarea{
    width:100%;
    height:120px;
    margin-top:10px;
    resize:vertical;
    background:#222;
    color:#fff;
    border:1px solid #444;
    padding:8px;
}

button{
    width:100%;
    margin-top:10px;
    padding:10px;
    cursor:pointer;
}

input[type=text]{
    width:100%;
    padding:8px;
    margin-top:10px;
    background:#222;
    color:white;
    border:1px solid #444;
}

.list{
    overflow:auto;
    flex:1;
}

.item{
    display:flex;
    gap:10px;
    padding:10px;
    border-bottom:1px solid #333;
}

.item img{
    width:120px;
    border-radius:6px;
}

.info{
    flex:1;
    font-size:12px;
    word-break:break-all;
}

.grid{
    display:grid;
    gap:10px;
    height:100%;
}

.tile{
    background:#000;
    border-radius:8px;
    overflow:hidden;
    min-height:220px;
}

.tile iframe{
    width:100%;
    height:100%;
    border:none;
}

.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100%;
    color:#888;
    font-size:22px;
}

.youtube-link{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    gap:15px;
}

.youtube-link a{
    background:#cc0000;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:6px;
}

.counter{
    color:#87ceeb;
    margin-top:10px;
}

</style>
</head>
<body>

<div class="container">

    <div class="main">
        <div id="viewer" class="empty">
            Plak de broncode van GTWorld Streams
        </div>
    </div>

    <div class="sidebar">

        <div class="header">

            <h2>GTWorld Streams</h2>

            <textarea id="source"
placeholder="CTRL+U op GTWorld Streams pagina, alles kopiëren en hier plakken"></textarea>

            <button onclick="loadStreams()">
                Streams laden
            </button>

            <input
                id="filter"
                type="text"
                placeholder="Filter video-id..."
                oninput="renderList()">

            <div id="counter" class="counter"></div>

        </div>

        <div id="streamList" class="list"></div>

    </div>

</div>

<script>

let streams = [];
let selected = new Set();

function loadStreams()
{
    const html =
        document.getElementById("source").value;

    if(!html.trim())
    {
        alert("Geen broncode geplakt");
        return;
    }

    const ids =
        [...new Set(
            [...html.matchAll(/"videoId":"([^"]+)"/g)]
            .map(x => x[1])
        )];

    streams =
        ids.map(id => ({
            id,
            thumb:
             `https://i.ytimg.com/vi/${id}/mqdefault.jpg`
        }));

    selected =
        new Set(
            streams.map(
                x => x.id
            )
        );

    document.getElementById(
        "counter"
    ).innerText =
        streams.length +
        " unieke video's gevonden";

    renderList();
    renderGrid();
}

function renderList()
{
    const filter =
        document.getElementById(
            "filter"
        ).value.toLowerCase();

    const list =
        document.getElementById(
            "streamList"
        );

    const filtered =
        streams.filter(s =>
            s.id
             .toLowerCase()
             .includes(filter)
        );

    list.innerHTML =
        filtered.map((stream,index)=>`

        <div class="item">

            <input
                type="checkbox"
                ${selected.has(stream.id)
                    ? "checked"
                    : ""}

                onchange="toggle('${stream.id}')">

            <img src="${stream.thumb}">

            <div class="info">

                <strong>
                    ${stream.id}
                </strong>

                <br><br>

                <a href="https://www.youtube.com/watch?v=${stream.id}"
                   target="_blank"
                   style="color:#87ceeb">
                   Open op YouTube
                </a>

            </div>

        </div>

        `).join("");
}

function toggle(id)
{
    if(selected.has(id))
        selected.delete(id);
    else
        selected.add(id);

    renderGrid();
}

function renderGrid()
{
    const viewer =
        document.getElementById(
            "viewer"
        );

    const active =
        streams.filter(
            x =>
            selected.has(
                x.id
            )
        );

    if(active.length === 0)
    {
        viewer.className="empty";
        viewer.innerHTML =
            "Geen streams geselecteerd";
        return;
    }

    let cols = 1;

    if(active.length <= 1)
        cols = 1;
    else if(active.length <= 4)
        cols = 2;
    else if(active.length <= 9)
        cols = 3;
    else if(active.length <= 16)
        cols = 4;
    else
        cols = 5;

    viewer.className = "grid";

    viewer.style.gridTemplateColumns =
        `repeat(${cols},1fr)`;

    viewer.innerHTML =
        active.map(stream=>`

        <div class="tile">

            <iframe
                loading="lazy"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin"
                src="https://www.youtube.com/embed/${stream.id}?mute=1">
            </iframe>

        </div>

        `).join("");
}

</script>

</body>
</html>
